<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Offline — FSMS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 14px;
      background: linear-gradient(180deg, #6366f1, #4338ca);
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 34px; height: 34px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; font-weight: 700; }
    p { font-size: 0.95rem; line-height: 1.55; color: #64748b; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #4f46e5; color: #fff;
      font-size: 0.95rem; font-weight: 600;
      padding: 11px 22px; border-radius: 10px;
    }
    button:hover { background: #4338ca; }
    button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 6l8 4.5-8 4.5-8-4.5L16 6z" fill="#fff"/>
        <path d="M8.5 15.4v5.1c0 1.9 3.36 3.5 7.5 3.5s7.5-1.6 7.5-3.5v-5.1l-7.5 4.2-7.5-4.2z" fill="#fff" opacity="0.9"/>
        <path d="M16 15v9.2" stroke="#fff" stroke-width="1.6"/>
        <circle cx="16" cy="25.6" r="1.7" fill="#fff"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>FSMS needs a connection to load your data. Your work is safe — reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
